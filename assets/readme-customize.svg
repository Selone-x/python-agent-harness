<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title description"><title id="title">Keep your rule. Correct the implementation.</title><desc id="description">Removing the import passes the same audit; existing tools are preserved. Narrated replay of verified example results.</desc><rect x="1" y="1" width="1118" height="638" rx="12" fill="#0d1420" stroke="#28374b"/><text x="40" y="42" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#70ddba">PYTHON AGENT HARNESS</text><text x="864" y="42" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#8398b4">06 / 06   AGENT</text><text x="40" y="91" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#e8effa">Keep your rule. Correct the implementation.</text><text x="40" y="124" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#a6b8ce">Removing the import passes the same audit; existing tools are preserved.</text><rect x="40" y="569" width="160" height="5" rx="12" fill="#69d7b1" stroke="none"/><rect x="214" y="569" width="160" height="5" rx="12" fill="#69d7b1" stroke="none"/><rect x="388" y="569" width="160" height="5" rx="12" fill="#69d7b1" stroke="none"/><rect x="562" y="569" width="160" height="5" rx="12" fill="#69d7b1" stroke="none"/><rect x="736" y="569" width="160" height="5" rx="12" fill="#69d7b1" stroke="none"/><rect x="910" y="569" width="160" height="5" rx="12" fill="#69d7b1" stroke="none"/><text x="40" y="609" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#8398b4">ILLUSTRATED AGENT WORKFLOW / VERIFIED CONFIGURATION AND CLI CHECKS</text><rect x="40" y="158" width="398" height="376" rx="12" fill="#182638" stroke="#354d6b"/><text x="61" y="193" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#b0ccf2">YOU / PROJECT REQUIREMENTS</text><text x="63" y="250" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#e8effa">Keep our existing tools.</text><text x="63" y="295" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#e8effa">Calculations must not</text><text x="63" y="326" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#e8effa">depend on I/O adapters.</text><text x="63" y="371" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#b0ccf2">Net total = gross - fee.</text><text x="63" y="474" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#99b5d8">Your project. Your agreed rules.</text><rect x="460" y="158" width="620" height="376" rx="12" fill="#142f2a" stroke="#31584e"/><text x="481" y="193" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#83dfbc">AI AGENT / TAILORED HARNESS</text><rect x="478" y="210" width="584" height="305" rx="12" fill="#0b1728" stroke="none"/><text x="500" y="239" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#91a6c0">harness  /  replay</text><text x="500" y="288" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#8ee5c7">$ uv run ... harness audit</text><text x="500" y="333" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#8ee5c7">audit                   PASS</text><text x="500" y="378" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#9aaec7"># The boundary remains in project.toml.</text><text x="500" y="423" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#8ee5c7">Full project checks also pass.</text><rect x="500" y="472" width="8" height="16" rx="12" fill="#8ee5c7" stroke="none"/></svg>