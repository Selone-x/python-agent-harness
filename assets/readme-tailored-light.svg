  <circle cx="232" cy="192" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:a_rules-ring"/>
  <rect x="232" y="144" width="184" height="64" rx="7" fill="#15803D" class="glow" style="animation-name:a_rules-glow"/>
  <circle cx="324" cy="208" r="4" fill="#15803D" class="pkt" style="animation-name:a_review"/>
  <circle cx="324" cy="264" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:a_review-ring"/>
