<svg xmlns="http://www.w3.org/2000/svg" width="660" height="432" viewBox="0 0 660 432" fill="none" role="img" aria-label="Your agent reads the existing project and your rules, proposes a plan for your approval, then prepares the project harness and its checks.">
<style>
    /* ---- type ramp (light skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #2D3142; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #4F5D75; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #4F5D75; }
    .t-name  { font-size: 12px; letter-spacing: 1px; fill: #3B4054; }
    .t-small { font-size: 10px; letter-spacing: 1px; fill: #4F5D75; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #4F5D75; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #4F5D75; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #6E6479; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 10s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 10s; }
    /* a_code: Inspect the existing project */
    @keyframes a_code {
      0%, 3% { transform: translate(0, 0); opacity: 0; }
      3.6% { opacity: 1; }
      9% { transform: translate(60px, 0px); opacity: 1; }
      10.2%, 100% { transform: translate(60px, 0px); opacity: 0; }
    }
    @keyframes a_code-ring { 0%, 9% { transform: scale(0.4); opacity: 0; } 9.4% { transform: scale(0.5); opacity: 0.8; } 14%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes a_code-glow { 0%, 9% { opacity: 0; } 9.8% { opacity: 0.18; } 13%, 100% { opacity: 0; } }
    /* a_rules: Read the user requirements */
    @keyframes a_rules {
      0%, 13% { transform: translate(0, 0); opacity: 0; }
      13.6% { opacity: 1; }
      14.76% { transform: translate(32px, 0px); }
      20.46% { transform: translate(32px, -104px); }
      22% { transform: translate(60px, -104px); opacity: 1; }
      23.2%, 100% { transform: translate(60px, -104px); opacity: 0; }
    }
    @keyframes a_rules-ring { 0%, 22% { transform: scale(0.4); opacity: 0; } 22.4% { transform: scale(0.5); opacity: 0.8; } 27%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes a_rules-glow { 0%, 22% { opacity: 0; } 22.8% { opacity: 0.18; } 26%, 100% { opacity: 0; } }
    /* a_review: Show the proposed plan for approval */
    @keyframes a_review {
      0%, 29% { transform: translate(0, 0); opacity: 0; }
      29.6% { opacity: 1; }
      36% { transform: translate(0px, 56px); opacity: 1; }
      37.2%, 100% { transform: translate(0px, 56px); opacity: 0; }
    }
    @keyframes a_review-ring { 0%, 36% { transform: scale(0.4); opacity: 0; } 36.4% { transform: scale(0.5); opacity: 0.8; } 41%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes a_review-glow { 0%, 36% { opacity: 0; } 36.8% { opacity: 0.18; } 40%, 100% { opacity: 0; } }
    /* a_build: Write the agreed project specification */
    @keyframes a_build {
      0%, 42% { transform: translate(0, 0); opacity: 0; }
      42.6% { opacity: 1; }
      49% { transform: translate(72px, 0px); opacity: 1; }
      50.2%, 100% { transform: translate(72px, 0px); opacity: 0; }
    }
    @keyframes a_build-ring { 0%, 49% { transform: scale(0.4); opacity: 0; } 49.4% { transform: scale(0.5); opacity: 0.8; } 54%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes a_build-glow { 0%, 49% { opacity: 0; } 49.8% { opacity: 0.18; } 53%, 100% { opacity: 0; } }
    /* a_checks: Generate and run the configured checks */
    @keyframes a_checks {
      0%, 56% { transform: translate(0, 0); opacity: 0; }
      56.6% { opacity: 1; }
      63% { transform: translate(0px, -56px); opacity: 1; }
      64.2%, 100% { transform: translate(0px, -56px); opacity: 0; }
    }
    @keyframes a_checks-ring { 0%, 63% { transform: scale(0.4); opacity: 0; } 63.4% { transform: scale(0.5); opacity: 0.8; } 68%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes a_checks-glow { 0%, 63% { opacity: 0; } 63.8% { opacity: 0.18; } 67%, 100% { opacity: 0; } }
    /* a_phase1: phase */
    @keyframes a_phase1 { 0%, 25% { opacity: 1; } 26%, 100% { opacity: 0; } }
    /* a_phase2: phase */
    @keyframes a_phase2 { 0%, 26% { opacity: 0; } 27%, 41% { opacity: 1; } 42%, 100% { opacity: 0; } }
    /* a_phase3: phase */
    @keyframes a_phase3 { 0%, 41% { opacity: 0; } 42%, 88% { opacity: 1; } 89%, 100% { opacity: 0; } }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>
<rect x="0.5" y="0.5" width="659" height="431" rx="12" fill="#F5F5F5" stroke="#D9DADB"/>
<text class="t-title" x="28" y="44" text-anchor="start">TAILORED TO YOUR PROJECT</text>
<text class="t-sub" x="28" y="72" text-anchor="start">Your code and rules become an agreed, executable harness.</text>
<path d="M 172 176 L 232 176" stroke="#BFC0C0" stroke-width="1.5"/><polygon points="226,179 232,176 226,173" fill="#BFC0C0"/>
<path d="M 172 296 L 196 296 Q 204 296 204 288 L 204 200 Q 204 192 212 192 L 232 192" stroke="#BFC0C0" stroke-width="1.5"/><polygon points="226,195 232,192 226,189" fill="#BFC0C0"/>
<path d="M 324 208 L 324 264" stroke="#BFC0C0" stroke-width="1.5"/><polygon points="321,258 324,264 327,258" fill="#BFC0C0"/>
<path d="M 416 296 L 488 296" stroke="#BFC0C0" stroke-width="1.5"/><polygon points="482,299 488,296 482,293" fill="#BFC0C0"/>
<path d="M 556 264 L 556 208" stroke="#BFC0C0" stroke-width="1.5"/><polygon points="559,214 556,208 553,214" fill="#BFC0C0"/>
<g data-node="project"><rect x="32" y="144" width="140" height="64" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/><circle cx="46" cy="164" r="2.5" fill="#4F5D75"/><text class="t-name" x="56" y="168">PROJECT</text><text class="t-desc" x="44" y="192">your existing code</text></g>
<g data-node="rules"><rect x="32" y="264" width="140" height="64" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/><circle cx="46" cy="284" r="2.5" fill="#4F5D75"/><text class="t-name" x="56" y="288">RULES</text><text class="t-desc" x="44" y="312">your constraints</text></g>
<g data-node="agent"><rect x="232" y="144" width="184" height="64" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/><circle cx="246" cy="164" r="2.5" fill="#4F5D75"/><text class="t-name" x="256" y="168">YOUR AGENT</text><text class="t-desc" x="244" y="192">inspect + propose</text></g>
<g data-node="approval"><rect x="232" y="264" width="184" height="64" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/><circle cx="246" cy="284" r="2.5" fill="#4F5D75"/><text class="t-name" x="256" y="288">YOU APPROVE</text><text class="t-desc" x="244" y="312">review the plan</text></g>
<g data-node="harness"><rect x="488" y="264" width="140" height="64" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/><circle cx="502" cy="284" r="2.5" fill="#4F5D75"/><text class="t-name" x="512" y="288">HARNESS</text><text class="t-desc" x="500" y="312">project.toml</text></g>
<g data-node="checks"><rect x="488" y="144" width="140" height="64" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/><circle cx="502" cy="164" r="2.5" fill="#4F5D75"/><text class="t-name" x="512" y="168">CHECKS</text><text class="t-desc" x="500" y="192">lint · types · tests</text></g>
<text class="t-small" x="348" y="240" text-anchor="start">PLAN</text>
<text class="t-prose" x="330" y="368" text-anchor="middle">Keep your tools. Agree your boundaries. Run your checks.</text>
<!-- @motion:elements -->
  <circle cx="172" cy="176" r="4" fill="#15803D" class="pkt" style="animation-name:a_code"/>
