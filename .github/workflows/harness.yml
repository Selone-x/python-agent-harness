name: Harness
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
env:
  HYPOTHESIS_PROFILE: ci
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
jobs:
  checks:
    name: harness-${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group: ["package", "static", "tests"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.13.1
      - run: python -I .harness/runner.pyz setup
      - run: python -I .harness/runner.pyz check --group ${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-${{ matrix.group }}
          path: .harness/reports/
          include-hidden-files: true
          retention-days: 7
  gate:
    name: harness-gate
    if: ${{ always() }}
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: harness-*
          path: .harness/reports/
          merge-multiple: true
      - run: python -I .harness/runner.pyz gate
